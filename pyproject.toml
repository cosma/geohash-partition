[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geohash-partition"
version = "0.1.0"
description = "Constraint-based geographic partitioning: assemble geohash grids into connected, weight-balanced areas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Cosmin Voicu" }]
keywords = ["geohash", "geospatial", "partitioning", "territories", "zones", "geojson", "leaflet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
geohash-partition = "geohash_partition.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geohash_partition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
