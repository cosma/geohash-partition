[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geohash-partition"
version = "0.1.2"
description = "Constraint-based geographic partitioning: assemble geohash grids into connected, weight-balanced areas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Cosmin Voicu" }]
keywords = ["geohash", "geospatial", "partitioning", "territories", "zones", "geojson", "leaflet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[dependency-groups]
# Code quality tools, pinned so local runs and CI agree.
# mypy needs Python 3.10+, so it is skipped when resolving for 3.9.
quality = [
  "ruff==0.16.7",
  "mypy==2.3.1; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/cosma/geohash-partition"
Repository = "https://github.com/cosma/geohash-partition"
Issues = "https://github.com/cosma/geohash-partition/issues"

[project.scripts]
geohash-partition = "geohash_partition.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geohash_partition"]

[tool.hatch.build.targets.sdist]
# Ship only the package and its tests; README, LICENSE and pyproject.toml are added automatically.
include = ["/geohash_partition", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
# Keep README examples hand-aligned for readability.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  # Newer type-hint syntax (list[str], X | None) needs Python 3.10+.
  # Enable these once requires-python is raised above 3.9.
  "UP006", "UP007", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["RUF001"]  # the multiplication sign in figure labels is intentional

[tool.mypy]
files = ["geohash_partition"]
warn_unused_ignores = true
warn_redundant_casts = true
