# Lint, format and type checks run once; tests run on every supported Python version.
# Everything is installed and run with uv: https://docs.astral.sh/uv/
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python 3.14
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Lint with Ruff
      run: uv run --only-group quality ruff check --output-format=github .
    - name: Check formatting with Ruff
      run: uv run --only-group quality ruff format --check --diff .
    - name: Type check with mypy
      run: uv run --group quality mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Test with pytest
      run: uv run --extra dev pytest
