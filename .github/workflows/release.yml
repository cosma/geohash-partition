# Publish a release to PyPI when a version tag such as v0.1.0 is pushed.
# Uses PyPI trusted publishing: no API token is stored in this repository.
# One-time setup on PyPI: add a pending publisher for project "geohash-partition",
# owner "cosma", repository "geohash-partition", workflow "release.yml", environment "pypi".

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        python-version: "3.14"
        enable-cache: false
    - name: Check the tag matches the project version
      run: |
        project_version="$(uv version --short)"
        tag_version="${GITHUB_REF_NAME#v}"
        if [ "$project_version" != "$tag_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $project_version in pyproject.toml"
          exit 1
        fi
    - name: Build
      run: uv build
    - name: Smoke test the wheel
      run: |
        uv run --isolated --no-project --with dist/*.whl \
          python -c "import geohash_partition as g; assert g.__version__ == '${GITHUB_REF_NAME#v}', g.__version__; print(g.__version__)"
        uv run --isolated --no-project --with dist/*.whl geohash-partition --version
    - name: Smoke test the source distribution
      run: |
        uv run --isolated --no-project --with dist/*.tar.gz \
          python -c "import geohash_partition as g; print(g.__version__)"
    - name: Upload distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geohash-partition/
    permissions:
      id-token: write
    steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        enable-cache: false
    - name: Download distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Generate attestations
      uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027  # v0.0.6
    - name: Publish
      run: uv publish
